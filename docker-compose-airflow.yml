version: '3.0'

services:
# message broker: Redis
  redis:
    image: 'bitnami/redis:latest'
    ports:
      - 6379:6379
    volumes:
      - 'redis_data:/bitnami/redis/data'
    environment:
      - ALLOW_EMPTY_PASSWORD=yes # only for internal network
    restart: always

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - my_swarm_network

  # initialize Airflow database
  initdb:
    image: clara690/job_airflow:${DOCKER_IMAGE_VERSION}
    command: uv run --env-file=.env airflow db init # initialize Airflow metadata DB
    restart: on-failure # restart if fails
    deploy:
      mode: replicated #swarm replicated mode
      replicas: 1 
      placement:
        constraints: [node.labels.airflow==true]  # 僅部署在標記為 airflow 的節點
    networks:
      - my_swarm_network

  # create airflow user
  create-user:
    image: clara690/job_airflow:${DOCKER_IMAGE_VERSION}
    # create user account 
    command: >-
      uv run --env-file=.env airflow users create
      --username admin --firstname clara --lastname tsai
      --role Admin -p admin
      --email clara80416@gmail.com
    depends_on:
      - initdb
    restart: on-failure
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - my_swarm_network

  webserver:
    image: clara690/job_airflow:${DOCKER_IMAGE_VERSION}
    hostname: "airflow-webserver"  
    command: uv run --env-file=.env airflow webserver -p 5000  # 啟動 webserver，使用 5000 port
    depends_on:
      - initdb  
      - redis
    restart: always  
    ports:
      - 5000:5000  
    environment:
      - TZ=Asia/Taipei
      - PYTHONPATH=/job_airflow
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - my_swarm_network
  scheduler:
    image: clara690/job_airflow:${DOCKER_IMAGE_VERSION}
    hostname: "airflow-scheduler"
    command: uv run --env-file=.env airflow scheduler  # start scheduler
    depends_on:
      - initdb
      - redis
    restart: always
    environment:
      - TZ=Asia/Taipei
      - PYTHONPATH=/job_airflow
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - my_swarm_network
  worker:
    image: clara690/job_airflow:${DOCKER_IMAGE_VERSION}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    restart: always
    environment:
      - TZ=Asia/Taipei
      - PYTHONPATH=/job_airflow
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - scheduler
      - redis
    command: uv run --env-file=.env airflow celery worker --without-mingle --without-gossip -H "celery@%h"
    # swarm 設定
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.worker==true]
    networks:
        - my_swarm_network


networks:
  my_swarm_network:
    external: true

volumes:
  redis_data:

